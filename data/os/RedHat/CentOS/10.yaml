---
# CentOS Stream 10 uses the EPEL 10 Stream repositories (epel-10s,
# epel-testing-10s, ...), like Fedora's epel-release package does through
# dnf's $stream variable.
epel::epel_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-%{facts.os.release.major}s&arch=$basearch'
epel::epel_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-%{facts.os.release.major}s&arch=$basearch'
epel::epel_testing_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-%{facts.os.release.major}s&arch=$basearch'
epel::epel_testing_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-%{facts.os.release.major}s&arch=$basearch'
epel::epel_source_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-source-%{facts.os.release.major}s&arch=source'
epel::epel_source_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-source-%{facts.os.release.major}s&arch=source'
epel::epel_debuginfo_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-debug-%{facts.os.release.major}s&arch=$basearch'
epel::epel_debuginfo_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-debug-%{facts.os.release.major}s&arch=$basearch'
epel::epel_testing_source_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-source-%{facts.os.release.major}s&arch=source'
epel::epel_testing_source_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-source-%{facts.os.release.major}s&arch=source'
epel::epel_testing_debuginfo_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-debug-%{facts.os.release.major}s&arch=$basearch'
epel::epel_testing_debuginfo_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-debug-%{facts.os.release.major}s&arch=$basearch'
