---
# Pin EPEL to the host's minor branch: epel-10 tracks the latest RHEL minor and breaks derivatives that lag it.
# dnf resolves $releasever_minor per transaction; Oracle Linux lacks it, so fall back to the os.release.minor fact.
epel::epel_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=$basearch'
epel::epel_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=$basearch'
epel::epel_testing_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=$basearch'
epel::epel_testing_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=$basearch'
epel::epel_source_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-source-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=source'
epel::epel_source_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-source-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=source'
epel::epel_debuginfo_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-debug-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=$basearch'
epel::epel_debuginfo_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-debug-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=$basearch'
epel::epel_testing_source_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-source-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=source'
epel::epel_testing_source_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-source-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=source'
epel::epel_testing_debuginfo_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-debug-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=$basearch'
epel::epel_testing_debuginfo_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-debug-%{facts.os.release.major}.${releasever_minor:-%{facts.os.release.minor}}&arch=$basearch'
