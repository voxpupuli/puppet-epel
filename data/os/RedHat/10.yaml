---
# EPEL 10 is published per minor release (epel-10.0, epel-10.1, ...) and the
# testing/debug/source repositories use the 'epel-<flavour>-<release>'
# naming. Like Fedora's epel-release package, use the repositories named after
# the major release (epel-10, epel-testing-10, ...), which always point to the
# EPEL branch of the latest RHEL minor release. Pinning the minor release from
# the os.release.minor fact breaks minor upgrades: the fact is only updated on
# the Puppet run after the upgrade, so during the upgrade dnf still uses the
# previous, frozen, EPEL branch whose packages can conflict with the new base
# packages. Source repositories use arch=source, as in epel-release.
epel::epel_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-%{facts.os.release.major}&arch=$basearch'
epel::epel_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-%{facts.os.release.major}&arch=$basearch'
epel::epel_testing_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-%{facts.os.release.major}&arch=$basearch'
epel::epel_testing_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-%{facts.os.release.major}&arch=$basearch'
epel::epel_source_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-source-%{facts.os.release.major}&arch=source'
epel::epel_source_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-source-%{facts.os.release.major}&arch=source'
epel::epel_debuginfo_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-debug-%{facts.os.release.major}&arch=$basearch'
epel::epel_debuginfo_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-debug-%{facts.os.release.major}&arch=$basearch'
epel::epel_testing_source_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-source-%{facts.os.release.major}&arch=source'
epel::epel_testing_source_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-source-%{facts.os.release.major}&arch=source'
epel::epel_testing_debuginfo_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-debug-%{facts.os.release.major}&arch=$basearch'
epel::epel_testing_debuginfo_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-debug-%{facts.os.release.major}&arch=$basearch'
