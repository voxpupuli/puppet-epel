---
# EPEL 10 is published per minor release (epel-10.0, epel-10.1, ...) and the
# testing/debug/source repositories switched to the 'epel-<flavour>-<release>'
# naming. dnf on EL10 derives $releasever_minor from the distribution
# (system-release(releasever_minor)), so let dnf pick the matching tree.
epel::epel_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-10.$releasever_minor&arch=$basearch'
epel::epel_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-10.$releasever_minor&arch=$basearch'
epel::epel_testing_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-10.$releasever_minor&arch=$basearch'
epel::epel_testing_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-10.$releasever_minor&arch=$basearch'
epel::epel_source_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-source-10.$releasever_minor&arch=$basearch'
epel::epel_source_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-source-10.$releasever_minor&arch=$basearch'
epel::epel_debuginfo_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-debug-10.$releasever_minor&arch=$basearch'
epel::epel_debuginfo_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-debug-10.$releasever_minor&arch=$basearch'
epel::epel_testing_source_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-source-10.$releasever_minor&arch=$basearch'
epel::epel_testing_source_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-source-10.$releasever_minor&arch=$basearch'
epel::epel_testing_debuginfo_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-debug-10.$releasever_minor&arch=$basearch'
epel::epel_testing_debuginfo_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-testing-debug-10.$releasever_minor&arch=$basearch'
