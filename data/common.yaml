---
# Default mirrorlist/metalink URLs. EPEL 8 and 9 publish a single repository
# per major release. Overridden for EL10 in os/RedHat/10.yaml.
epel::epel_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-%{facts.os.release.major}&arch=$basearch'
epel::epel_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-%{facts.os.release.major}&arch=$basearch'
epel::epel_testing_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=testing-epel%{facts.os.release.major}&arch=$basearch'
epel::epel_testing_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=testing-epel%{facts.os.release.major}&arch=$basearch'
epel::epel_source_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-source-%{facts.os.release.major}&arch=$basearch'
epel::epel_source_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-source-%{facts.os.release.major}&arch=$basearch'
epel::epel_debuginfo_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=epel-debug-%{facts.os.release.major}&arch=$basearch'
epel::epel_debuginfo_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=epel-debug-%{facts.os.release.major}&arch=$basearch'
epel::epel_testing_source_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=testing-source-epel%{facts.os.release.major}&arch=$basearch'
epel::epel_testing_source_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=testing-source-epel%{facts.os.release.major}&arch=$basearch'
epel::epel_testing_debuginfo_mirrorlist: 'https://mirrors.fedoraproject.org/metalink?repo=testing-debug-epel%{facts.os.release.major}&arch=$basearch'
epel::epel_testing_debuginfo_metalink: 'https://mirrors.fedoraproject.org/metalink?repo=testing-debug-epel%{facts.os.release.major}&arch=$basearch'
